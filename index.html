<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دَرْب | DARB</title>
<style>
body{font-family:Arial;background:#f7f3ea;margin:0;text-align:center}
header{background:#1e3a2f;color:white;padding:15px}
.cart-bar{background:#1e3a2f;color:white;padding:10px;position:sticky;top:0;z-index:10}
button{background:#2e5a4a;color:white;border:none;padding:10px 18px;border-radius:10px;margin:5px;cursor:pointer}
.cat-btn{background:white;color:#1e3a2f;border:1px solid #1e3a2f}
.cat-btn.active{background:#1e3a2f;color:white}
.store{background:white;margin:15px;padding:20px;border-radius:15px;box-shadow:0 2px 8px #ccc;cursor:pointer}
.product{background:#fff;padding:12px;margin:10px;border-radius:12px;border:1px solid #eee}
.product img{width:100%;max-width:300px;border-radius:12px}
footer{background:#1e3a2f;color:white;padding:20px;margin-top:20px}
input{padding:10px;width:80%;border-radius:10px;border:1px solid #ccc}
</style>
</head>
<body>

<header>
<h1>دَرْب | DARB</h1>
<p>اطلب من أفضل المتاجر</p>
<input id="search" placeholder="ابحث عن متجر..." onkeyup="searchStores()">
</header>

<div class="cart-bar">
🛒 السلة: <span id="cartCount">0</span> |
<button onclick="orderNow()">اطلب الحين</button>
</div>

<!-- الصفحة الرئيسية - التصنيفات -->
<div id="home">
<h2>اختر التصنيف</h2>
<button class="cat-btn active" onclick="filterCat('الكل',this)">الكل</button>
<button class="cat-btn" onclick="filterCat('مطاعم',this)">مطاعم</button>
<button class="cat-btn" onclick="filterCat('بقالات',this)">بقالات</button>
<button class="cat-btn" onclick="filterCat('مشاريع منزلية',this)">مشاريع منزلية</button>
<button class="cat-btn" onclick="filterCat('حلويات',this)">حلويات</button>

<div id="stores">
<!-- متجر ميث -->
<div class="store" data-category="مشاريع منزلية" onclick="openStore('Maith')">
<strong>متجر ميث - Maith</strong>
<p>منتجات عناية للجسم والبشرة</p>
<button>ادخل المتجر</button>
</div>

<!-- هنا تقدرين تضيفين متاجر ثانية بعدين بنفس الطريقة -->
</div>
</div>

<!-- صفحة داخل متجر ميث -->
<div id="store-Maith" style="display:none;">
<button onclick="backToStores()">⬅ رجوع للمتاجر</button>
<h2>متجر ميث - Maith</h2>
<p>منتجات عناية للجسم والبشرة</p>

<div class="product">
<img src="https://via.placeholder.com/300x200?text=مقشر+النيلة">
<p><b>مقشر النيلة الزرقاء</b> - 5.000</p>
<button onclick="addToCart('مقشر النيلة الزرقاء',5)">أضف للسلة</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200?text=مقشر+الجل">
<p><b>مقشر الجل</b> - 4.500</p>
<button onclick="addToCart('مقشر الجل',4.5)">أضف للسلة</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300x200?text=المقشر+الكريمي">
<p><b>المقشر الكريمي</b> - 3.900</p>
<button onclick="addToCart('المقشر الكريمي',3.9)">أضف للسلة</button>
</div>

</div>

<footer>
<p><b>دَرْب | DARB</b></p>
<p>سلطنة عُمان</p>
</footer>

<script>
let cart = [];

function filterCat(cat, btn){
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('#stores .store').forEach(s=>{
if(cat=='الكل' || s.getAttribute('data-category')==cat){ s.style.display='block'; }
else { s.style.display='none'; }
});
}

function openStore(name){
document.getElementById('home').style.display='none';
document.getElementById('store-'+name).style.display='block';
window.scrollTo(0,0);
}

function backToStores(){
document.getElementById('home').style.display='block';
document.getElementById('store-Maith').style.display='none';
}

function addToCart(name, price){
cart.push({name:name, price:price});
document.getElementById('cartCount').innerText = cart.length;
alert('تمت إضافة ' + name + ' للسلة');
}

function orderNow(){
if(cart.length==0){ alert('السلة فاضية'); return; }
let msg = 'مرحبا، أريد الطلب من متجر ميث - Maith:%0A';
cart.forEach(item=>{ msg += '- ' + item.name + ' - ' + item.price + '%0A'; });
window.open('https://wa.me/96894799751?text=' + msg, '_blank');
}

function searchStores(){
let v = document.getElementById('search').value;
document.querySelectorAll('#stores .store').forEach(s=>{
s.style.display = s.innerText.includes(v) ? 'block' : 'none';
});
}
</script>

</body>
</html>
