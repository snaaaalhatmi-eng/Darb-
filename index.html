<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARB | دَرْب</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:#F5F0E6}
.top{background:#536343;color:#fff;padding:24px 16px 16px;text-align:center;border-radius:0 0 20px 20px}
.top h1{margin:0;font-size:30px}
.top p{margin:8px 0;color:#D8C8AE}
.top input{width:100%;padding:13px;border-radius:12px;border:none;outline:none;margin-top:10px;text-align:right}
.welcome{background:#fff;margin:16px;border-radius:16px;padding:16px;text-align:center}
.welcome b{font-size:18px}
.welcome p{margin:4px;color:#888}
.logout{background:#c0392b;color:#fff;border:none;padding:8px 18px;border-radius:10px;margin-top:8px;cursor:pointer}
.actions{display:flex;gap:8px;justify-content:center;padding:0 16px;flex-wrap:wrap}
.actions button{background:#3d4a32;color:#fff;border:none;padding:10px 14px;border-radius:12px;cursor:pointer}
.actions .bell{background:#fff;font-size:20px}
h2{text-align:center;margin:24px 0 12px}
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.cats button{background:#fff;border:1px solid #536343;padding:9px 16px;border-radius:12px;cursor:pointer}
.cats button.active{background:#536343;color:#fff}
.store{background:#fff;margin:16px;border-radius:16px;padding:20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.store h3{margin:0}
.store p{color:#555}
.enter{background:#536343;color:#fff;border:none;padding:10px 22px;border-radius:12px;cursor:pointer}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:120px;object-fit:cover}
.add{background:#536343;color:#fff;border:none;padding:8px 14px;border-radius:10px;cursor:pointer}
footer{background:#536343;color:#fff;text-align:center;padding:20px;margin-top:20px}
#cartPage,#checkoutPage,#donePage{display:none;padding:16px}
.item{background:#fff;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #D8C8AE}
.btn{width:100%;background:#536343;color:#fff;border:none;padding:14px;border-radius:14px;margin-top:10px}
</style>
</head>
<body>

<div class="top">
<h1>DARB | دَرْب</h1>
<p>اطلب من أفضل المتاجر</p>
<input id="search" placeholder="ابحث عن متجر..." oninput="render()">
</div>

<div class="welcome">
<b>👋 أهلاً سناء هلال الحاتمي</b>
<p>94799851</p>
<button class="logout">تسجيل خروج</button>
</div>

<div class="actions">
<button onclick="showCart()">🛒 السلة: <span id="count">0</span></button>
<button onclick="alert('طلباتك: لا يوجد طلبات بعد')">🧾 طلباتي</button>
<button>🔔</button>
<button onclick="document.getElementById('stores').scrollIntoView({behavior:'smooth'})">اطلب الحين</button>
</div>

<h2>اختر التصنيف</h2>
<div class="cats" id="cats"></div>

<div id="stores"></div>

<div class="products" id="products"></div>

<div id="cartPage">
<h2>🛒 السلة</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button class="btn" onclick="showCheckout()">إتمام الطلب</button>
<button class="btn" style="background:#D8C8AE;color:#333" onclick="goHome()">رجوع</button>
</div>

<div id="checkoutPage">
<h2>الدفع والتوصيل</h2>
<input placeholder="الاسم الكامل" id="n">
<input placeholder="رقم الهاتف" id="p">
<input placeholder="عنوان التوصيل" id="a">
<select id="pay"><option>الدفع عند الاستلام</option><option>التحويل البنكي مع رفع الإيصال</option></select>
<input type="file" id="receipt" style="display:none">
<h3 id="final"></h3>
<button class="btn" onclick="confirmOrder()">تأكيد الطلب</button>
</div>

<div id="donePage" style="text-align:center">
<h2>تم إتمام عملية طلبك بنجاح! 🎉</h2>
<p>بيتم تجهيز طلبك وشحنه قريباً ❤️</p>
<h3 id="orderNo"></h3>
<p id="orderDet"></p>
<button class="btn" onclick="goHome()">تسوق مرة ثانية</button>
</div>

<footer><b>DARB | دَرْب</b><br>سلطنة عُمان<br>كل طلب له دَرْب ❤️</footer>

<script>
let cats=["الكل","مطاعم","بقالات","مشاريع منزلية","حلويات","محلات","ورد"];
let active="الكل";
let stores=[
{id:1,name:"متجر ميث - Maith",desc:"منتجات عناية للجسم والبشرة",cat:"محلات",img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600"},
{id:2,name:"مطعم البيت العماني",desc:"أكل عماني أصيل",cat:"مطاعم",img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600"},
{id:3,name:"بقالة النخلة",desc:"كل احتياجات البيت",cat:"بقالات",img:"https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=600"},
{id:4,name:"وردة للورود",desc:"باقات ورد فاخرة",cat:"ورد",img:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600"},
{id:5,name:"مشروع أم سارة",desc:"كيك وحلويات منزلية",cat:"مشاريع منزلية",img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600"},
{id:6,name:"حلويات الحارة",desc:"حلويات عمانية",cat:"حلويات",img:"https://images.unsplash.com/photo-1551024506-0bccd828d307?w=600"},
];
let products=[
{id:1,name:"كريم ترطيب",price:5.0,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600"},
{id:2,name:"مجبوس دجاج",price:2.5,img:"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=600"},
{id:3,name:"باقة ورد",price:8.0,img:"https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=600"},
{id:4,name:"كيكة عسل",price:5.5,img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600"},
];
let cart=[];
function render(){
document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c==active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
let q=document.getElementById('search').value||"";
let fs=stores.filter(s=>(active=="الكل"||s.cat==active)&&s.name.includes(q));
document.getElementById('stores').innerHTML=fs.map(s=>`<div class="store"><h3>${s.name}</h3><p>${s.desc}</p><button class="enter" onclick="alert('دخلت ${s.name}')">ادخل المتجر</button></div>`).join('');
document.getElementById('products').innerHTML=products.map(p=>`<div class="card"><img src="${p.img}"><h4>${p.name}</h4><b>${p.price.toFixed(3)} ر.ع</b><br><button class="add" onclick="add(${p.id})">+ إضافة</button></div>`).join('');
}
function setCat(c){active=c;render();}
function add(id){let f=cart.find(x=>x.id==id);if(f)f.qty++;else{let p=products.find(x=>x.id==id);cart.push({...p,qty:1});}document.getElementById('count').innerText=cart.reduce((a,b)=>a+b.qty,0);alert("تمت الإضافة ✅");}
function showCart(){document.getElementById('cartPage').style.display='block';window.scrollTo(0,0);let s=0;document.getElementById('cartItems').innerHTML=cart.map((it,i)=>{s+=it.price*it.qty;return `<div class="item"><span>${it.name} × ${it.qty}</span><b>${(it.price*it.qty).toFixed(3)} ر.ع</b></div>`}).join('')||"سلتك فاضية";document.getElementById('total').innerText=`الإجمالي مع التوصيل: ${(s+1).toFixed(3)} ر.ع`;}
function goHome(){document.getElementById('cartPage').style.display='none';document.getElementById('checkoutPage').style.display='none';document.getElementById('donePage').style.display='none';}
function showCheckout(){if(!cart.length){alert("سلتك فاضية");return;}document.getElementById('cartPage').style.display='none';document.getElementById('checkoutPage').style.display='block';let s=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('final').innerText=`الإجمالي: ${(s+1).toFixed(3)} ر.ع`;}
document.getElementById('pay').addEventListener('change',e=>{document.getElementById('receipt').style.display=e.target.value.includes('عند الاستلام')?'none':'block';});
function confirmOrder(){let n=document.getElementById('n').value,p=document.getElementById('p').value,a=document.getElementById('a').value;if(!n||!p||!a){alert("عبي كل البيانات");return;}document.getElementById('checkoutPage').style.display='none';document.getElementById('donePage').style.display='block';document.getElementById('orderNo').innerText="رقم الطلب: DARB-"+Math.floor(1000+Math.random()*9000);document.getElementById('orderDet').innerText=`شكراً ${n} ❤️ بيوصلك طلبك على ${a}`;cart=[];document.getElementById('count').innerText="0";}
render();
</script>
</body>
</html>
